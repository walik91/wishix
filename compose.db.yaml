services:
  db:
    image: ${COCKROACH_IMAGE:?Укажите COCKROACH_IMAGE в .env}
    entrypoint: ["/cockroach/cockroach"]
    command:
      - start-single-node
      - --insecure
      - --listen-addr=0.0.0.0:26257
      - --advertise-addr=db
      - --store=/cockroach/cockroach-data
    restart: unless-stopped
    ports:
      - "127.0.0.1:26257:26257"
    volumes:
      - db-data:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "/cockroach/cockroach", "sql", "--insecure", "--host=db:26257", "--execute=SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  db-init:
    image: ${COCKROACH_IMAGE:?Укажите COCKROACH_IMAGE в .env}
    entrypoint: ["/bin/bash", "/init/db.sh"]
    environment:
      DB_NAME: ${DB_NAME:?Укажите DB_NAME в .env}
      DB_USER: ${DB_USER:?Укажите DB_USER в .env}
    volumes:
      - ./docker/db/init.sh:/init/db.sh:ro
    depends_on:
      db:
        condition: service_healthy

  migrate:
    build:
      context: ./server
    profiles: [tools]
    entrypoint: ["./migrate"]
    command: ["status"]
    environment:
      DB_NAME: ${DB_NAME:?Укажите DB_NAME в .env}
      DB_USER: ${DB_USER:?Укажите DB_USER в .env}
    depends_on:
      db-init:
        condition: service_completed_successfully

volumes:
  db-data:
