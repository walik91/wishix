services:
  db:
    image: ${COCKROACH_IMAGE:?Укажите COCKROACH_IMAGE в .env}
    command:
      - start-single-node
      - --advertise-addr=db
      - --store=/cockroach/cockroach-data
    restart: unless-stopped
    volumes:
      - db-data:/cockroach/cockroach-data
      - db-node-certs:/cockroach/certs
    healthcheck:
      test: ["CMD", "/cockroach/cockroach", "sql", "--certs-dir=/cockroach/certs", "--host=db:26257", "--execute=SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  db-init:
    image: ${COCKROACH_IMAGE:?Укажите COCKROACH_IMAGE в .env}
    entrypoint: ["/bin/bash", "/init/db.sh"]
    environment:
      DB_NAME: ${DB_NAME:?Укажите DB_NAME в .env}
      DB_USER: ${DB_USER:?Укажите DB_USER в .env}
      DB_PASSWORD: ${DB_PASSWORD:?Укажите DB_PASSWORD в .env}
    volumes:
      - ./docker/db/init.sh:/init/db.sh:ro
      - db-node-certs:/cockroach/certs:ro
      - db-client-ca:/db-certs
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  db-node-certs:
  db-client-ca:
