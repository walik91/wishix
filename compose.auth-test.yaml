# Isolated authentication checks: dedicated volumes/network and test credentials.
# This file intentionally does not reference the working .env or real SMTP.
name: wishix-auth-test

x-test-database: &test-database
  DB_NAME: wishix_auth_test
  DB_USER: wishix_auth_test
  DB_PASSWORD: local-test-password-only

services:
  db:
    image: cockroachdb/cockroach:v26.2.10
    command: [start-single-node, --advertise-addr=db, --store=/cockroach/cockroach-data]
    volumes:
      - db-data:/cockroach/cockroach-data
      - db-node-certs:/cockroach/certs
    healthcheck:
      test: [CMD, /cockroach/cockroach, sql, --certs-dir=/cockroach/certs, --host=db:26257, --execute=SELECT 1]
      interval: 3s
      timeout: 5s
      retries: 30

  db-init:
    image: cockroachdb/cockroach:v26.2.10
    entrypoint: [/bin/bash, /init/db.sh]
    environment: *test-database
    volumes:
      - ./docker/db/init.sh:/init/db.sh:ro
      - db-node-certs:/cockroach/certs:ro
      - db-client-ca:/db-certs
    depends_on:
      db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - 127.0.0.1:8026:8025

  server:
    build: ./server
    environment:
      <<: *test-database
      APP_ENV: development
      APP_ORIGIN: http://localhost:5174
      AUTH_SECRET: isolated-auth-test-secret-never-use-in-production
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: support@example.test
      SMTP_SECURITY: none
    volumes:
      - db-client-ca:/db-certs:ro
    depends_on:
      db-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/api/ready]
      interval: 3s
      timeout: 3s
      retries: 20

  front:
    build:
      context: ./front
      target: development
    environment:
      API_PROXY_TARGET: http://server:8080
    ports:
      - 127.0.0.1:5174:5173
    volumes:
      - ./front/src:/app/src:ro
    depends_on:
      server:
        condition: service_healthy

  migrate:
    build: ./server
    profiles: [tools]
    entrypoint: ["./migrate"]
    command: ["status"]
    environment: *test-database
    volumes:
      - db-client-ca:/db-certs:ro
    depends_on:
      db-init:
        condition: service_completed_successfully

  go-tests:
    image: golang:1.27.3-alpine3.24
    profiles: [checks]
    working_dir: /app
    command: [go, test, -tags=integration, -timeout, 600s, -v, ./internal/services, ./internal/db]
    environment: *test-database
    volumes:
      - ./server:/app:ro
      - db-client-ca:/db-certs:ro
      - go-test-cache:/go/pkg/mod
    depends_on:
      db-init:
        condition: service_completed_successfully

volumes:
  db-data:
  db-node-certs:
  db-client-ca:
  go-test-cache:
