name: wishix

include:
  - compose.db.yaml

services:
  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      DB_NAME: ${DB_NAME:?Укажите DB_NAME в .env}
      DB_USER: ${DB_USER:?Укажите DB_USER в .env}
      APP_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:?Укажите HTTPS APP_ORIGIN в .env}
      AUTH_SECRET: ${AUTH_SECRET:?Укажите AUTH_SECRET в .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTH_TRUSTED_PROXY_CIDRS: ${AUTH_TRUSTED_PROXY_CIDRS:-}
      SMTP_HOST: ${SMTP_HOST:?Укажите SMTP_HOST в .env}
      SMTP_PORT: ${SMTP_PORT:?Укажите SMTP_PORT в .env}
      SMTP_FROM: ${SMTP_FROM:?Укажите SMTP_FROM в .env}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURITY: ${SMTP_SECURITY:?Укажите SMTP_SECURITY в .env}
    depends_on:
      db-init:
        condition: service_completed_successfully
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s

  front:
    build:
      context: ./front
      target: production
      args:
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
    restart: unless-stopped
    ports:
      - "${APP_PORT:?Укажите APP_PORT в .env}:8080"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
