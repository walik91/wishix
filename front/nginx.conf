server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;

    # Resolve the current Go container address after a restart or update.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Neither access nor proxy error logs may contain OAuth callback parameters.
    location = /api/auth/google/callback {
        access_log off;
        error_log /dev/null crit;
        set $api http://server:8080;
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/facebook/callback {
        access_log off;
        error_log /dev/null crit;
        set $api http://server:8080;
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        client_max_body_size 6m;
        set $api http://server:8080;
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ "^/(reservation|cp)/?$" {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    # Resolve the owner before serving the SPA so crawlers receive a real 301.
    location ~ "^/[A-Za-z0-9_]{3,30}/wishlist/shared/?$" {
        set $api http://server:8080;
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    # Resolve temporary username redirects before serving the public profile.
    location ~ "^/u/[A-Za-z0-9_]{3,30}/?$" {
        set $api http://server:8080;
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    location ~ "^/u/[A-Za-z0-9_]{3,30}/wishlist/[^/]+(/[^/]+)?/?$" {
        set $api http://server:8080;
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    location = /_shared_index {
        internal;
        alias /usr/share/nginx/html/index.html;
        default_type text/html;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag $upstream_http_x_robots_tag always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
