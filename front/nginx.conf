server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;

    # Resolve the current Go container address after a restart or update.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location /api {
        client_max_body_size 6m;
        set $api http://server:8080;
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Resolve the owner before serving the SPA so crawlers receive a real 301.
    location ~ "^/[A-Za-z0-9_]{3,30}/wishlist/shared/?$" {
        set $api http://server:8080;
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    location = /_shared_index {
        internal;
        alias /usr/share/nginx/html/index.html;
        default_type text/html;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag $upstream_http_x_robots_tag always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
