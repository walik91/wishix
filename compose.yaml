name: wishix

include:
  - compose.db.yaml

services:
  server:
    build:
      context: ./server
    environment:
      DB_NAME: ${DB_NAME:?Укажите DB_NAME в .env}
      DB_USER: ${DB_USER:?Укажите DB_USER в .env}
      DB_PASSWORD: ${DB_PASSWORD:?Укажите DB_PASSWORD в .env}
    volumes:
      - db-client-ca:/db-certs:ro
    depends_on:
      db-init:
        condition: service_completed_successfully
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    develop:
      watch:
        - action: rebuild
          path: ./server

  front:
    build:
      context: ./front
      target: development
    environment:
      API_PROXY_TARGET: http://server:8080
    ports:
      - "127.0.0.1:${APP_PORT:?Укажите APP_PORT в .env}:5173"
    volumes:
      - ./front/src:/app/src:ro
      - ./front/index.html:/app/index.html:ro
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

